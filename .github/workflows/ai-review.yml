# This is the name of the GitHub Action workflow. It will be displayed in the GitHub Actions UI.
name: AI Content Review

# This section defines the triggers for the workflow.
on:
  pull_request:
    paths:
      # The workflow runs when a pull request modifies any .adoc file in these directories.
      - 'articles/**.adoc'
      - 'topics/**.adoc'
      - 'concepts/**.adoc'
      - 'references/**.adoc'
      - 'tasks/**.adoc'
      - 'snippets/**.adoc'
      - 'glues/**.adoc'

# This section defines the jobs that will be executed as part of the workflow.
jobs:
  # This is the name of the job.
  ai_review:
    # This specifies the type of runner the job will run on. 'ubuntu-latest' is a GitHub-hosted runner.
    runs-on: ubuntu-latest
    # This sets an environment variable for the job to opt into the Node.js 24 runner, addressing future deprecation warnings.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    # These are the permissions granted to the GITHUB_TOKEN for this job.
    permissions:
      pull-requests: write # Required to post comments on pull requests.
      contents: read      # Required to check out the repository code.

    # This section defines the sequence of steps that make up the job.
    steps:
      # Step 1: Check out the repository code so the workflow can access it.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 fetches the entire git history, which is required for the changed-files action to work correctly on pull requests.
          fetch-depth: 0
          # submodules: true ensures that repository submodules, like 'ai-prompts', are checked out.
          submodules: true

      # Step 2: Use a third-party action to get a list of files that have changed in the pull request.
      - name: Get changed doc files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            # This list should match the paths in the 'on' trigger section.
            articles/**.adoc
            topics/**.adoc
            concepts/**.adoc
            references/**.adoc
            tasks/**.adoc
            snippets/**.adoc
            glues/**.adoc

      # Step 3: Run the main review logic using a GitHub script.
      - name: Run AI Review and Comment
        # This step only runs if the 'changed-files' step found any modified files.
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        env:
          # Pass the Gemini API key from GitHub secrets to the script.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          # The GITHUB_TOKEN is automatically created by Actions and is used to authenticate API requests.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Import the Node.js file system module to read files.
            const fs = require('fs');

            // Get the API key from the environment. The workflow fails if the secret is not set.
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              throw new Error('GEMINI_API_KEY is not set. Please add it to your repository secrets.');
            }

            // The main asynchronous function that contains the logic.
            async function run() {
              // Get the list of changed files from the output of the 'changed-files' step.
              const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.split(' ').filter(f => f);

              // If no relevant files were changed, log a message and exit.
              if (changedFiles.length === 0) {
                console.log('No relevant files changed.');
                return;
              }

              // Read the content of the instruction and agent prompt files from the repository.
              const instructionsPrompt = fs.readFileSync('ai-prompts/SUSE Style Guide/_INSTRUCTIONS.prompt', 'utf8');
              const geoAuditorPrompt = fs.readFileSync('ai-prompts/GEO-Content-Auditor.md', 'utf8');

              // Initialize objects for the pull request review.
              // The `reviewBody` will contain the main analysis, and `reviewComments` will hold line-specific suggestions.
              let reviewBody = `### 🤖 AI Content Review\n\nThis review is automatically generated based on the workflow in \`ai-prompts/SUSE Style Guide/_INSTRUCTIONS.prompt\`.\n\n`;
              let reviewComments = [];

              // Loop through each file that was changed.
              for (const file of changedFiles) {
                console.log(`Analyzing ${file}...`);
                // Read the content of the current file.
                const fileContent = fs.readFileSync(file, 'utf8');

                // Construct the final prompt to be sent to the AI model.
                const finalPrompt = `
                  ${instructionsPrompt}
                  ---
                  AGENT PROMPT:
                  ${geoAuditorPrompt}
                  ---
                  FILE TO ANALYZE: ${file} // Provide context about which file is being analyzed.
                  ---
                  FILE CONTENT:
                  ${fileContent} // The actual content of the file.
                  ---
                  Now, acting as the "GEO Content Auditor", please analyze the file content and provide your feedback in the specified output format.
                `;

                // --- Start of AI API Call ---
                let aiResponse;
                try {
                  // Use a fast and capable model suitable for this task.
                  const model = 'gemini-1.5-flash';
                  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

                  const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      contents: [{ parts: [{ text: finalPrompt }] }]
                    })
                  });

                  if (!response.ok) {
                    const errorBody = await response.text();
                    throw new Error(`API call failed with status ${response.status}: ${errorBody}`);
                  }

                  const data = await response.json();
                  // Safely access the generated text from the API response.
                  const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                  if (!responseText) {
                    aiResponse = '*AI analysis completed, but the response was empty or in an unexpected format.*';
                    console.log('Unexpected AI response format:', JSON.stringify(data, null, 2));
                  } else {
                    aiResponse = responseText;
                  }
                } catch (error) {
                  console.error('Error calling AI service:', error);
                  aiResponse = `*Error during AI analysis for \`${file}\`: ${error.message}*`;
                }
                // --- End of AI API Call ---

                // --- Start of Response Parsing and Suggestion Creation ---
                const rewriteMarker = '**The "GEO Rewrite"**:';
                const rewriteIndex = aiResponse.indexOf(rewriteMarker);

                let analysisPart = aiResponse;

                if (rewriteIndex !== -1) {
                  // If a rewrite is found, split the AI response into the analysis and the suggested code.
                  analysisPart = aiResponse.substring(0, rewriteIndex).trim();
                  let rewrittenCode = aiResponse.substring(rewriteIndex + rewriteMarker.length).trim();

                  // Clean up the rewritten code block if the AI wraps it in markdown code fences.
                  rewrittenCode = rewrittenCode.replace(/^```(markdown|adoc)?\s*/, '').replace(/```\s*$/, '').trim();

                  // The prompt asks to rewrite the first 150 words. We'll create a suggestion
                  // to replace the first few lines of the file with the rewrite.
                  const numLinesInRewrite = (rewrittenCode.match(/\n/g) || []).length + 1;

                  // Create a review comment object that will become a GitHub suggestion.
                  const suggestion = {
                    path: file,
                    side: 'RIGHT',
                    start_line: 1, // Start the suggestion on the first line.
                    line: numLinesInRewrite > 15 ? 15 : numLinesInRewrite, // Cap the suggestion to the first 15 lines to be safe.
                    body: `**🤖 AI Suggestion: The "GEO Rewrite"**\n\nTo improve "Answer Nugget Density", here is a suggested rewrite of the introduction:\n\n\`\`\`suggestion\n${rewrittenCode}\n\`\`\``
                  };
                  reviewComments.push(suggestion);
                }

                reviewBody += `---\n\n#### Review for \`${file}\`\n\n${analysisPart}\n\n`;
                // --- End of Response Parsing ---
              }

              // Use the GitHub API to post the review. This includes the main body and all line-specific suggestions.
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body: reviewBody,
                event: 'COMMENT',
                comments: reviewComments,
              });
            }

            // Execute the main function.
            run();